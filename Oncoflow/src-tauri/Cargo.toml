[package]
name = "oncoflow"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "oncoflow"

[features]
default = []
migration-cli = ["dep:clap"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oncoflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mdb-import"
path = "src/bin/mdb_import.rs"
required-features = ["migration-cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
clap = { version = "4", features = ["derive"], optional = true }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["errhandlingapi", "minwindef", "winspool"] }

[dev-dependencies]
tempfile = "3"
